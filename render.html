<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerar Bebê Com Capa API</title>
    <script src="https://unpkg.com/skinview3d@3.0.0-alpha.1/bundles/skinview3d.bundle.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script>
        async function renderizarAutomatico() {
            const urlParams = new URLSearchParams(window.location.search);
            const uuid = urlParams.get('uuid');

            if (!uuid) {
                document.body.style.color = "red";
                document.body.innerText = "Erro: UUID não fornecido na URL!";
                return;
            }
            try {
                const profileRes = await fetch(`https://api.gapple.pw/cors/sessionserver/${uuid}`);
                if (!profileRes.ok) throw new Error('Erro ao buscar sessão');
                const profileData = await profileRes.json();
                const texturesProperty = profileData.properties.find(p => p.name === 'textures');
                let skinUrl = `https://minotar.net/skin/${uuid}`;
                let capeUrl = null;
                if (texturesProperty) {
                    const decoded = JSON.parse(atob(texturesProperty.value));
                    if (decoded.textures?.SKIN?.url) skinUrl = decoded.textures.SKIN.url.replace("http://", "https://");
                    if (decoded.textures?.CAPE?.url) capeUrl = decoded.textures.CAPE.url.replace("http://", "https://");
                }
                const canvas = document.createElement('canvas');
                canvas.width = 300;
                canvas.height = 300;
                document.body.appendChild(canvas);
                const skinViewer = new skinview3d.SkinViewer({
                    canvas: canvas,
                    width: 300,
                    height: 300,
                    skin: skinUrl,
                    alpha: true
                });
                if (capeUrl) await skinViewer.loadCape(capeUrl);
                await skinViewer.loadSkin(skinUrl);
                skinViewer.zoom = 0.96;
                const player = skinViewer.playerObject;
                player.scale.set(0.9, 0.65, 0.9);
                player.skin.head.scale.set(1.83, 2.54, 1.83);
                player.skin.rightLeg.rotation.x = -0.15;
                player.skin.leftLeg.rotation.x = 0.15;
                player.skin.rightArm.rotation.x = 0.15;
                player.skin.leftArm.rotation.x = -0.15;
                player.position.y = -6.0; 
                player.rotation.y = Math.PI / 8;
                skinViewer.animation = null;
                skinViewer.render();
                const dataUrl = canvas.toDataURL("image/png");
                document.body.innerHTML = `<img src="${dataUrl}" style="width: 100%; height: 100%; object-fit: contain;" alt="Bebê 3D Render">`;
            } catch (err) {
                document.body.style.color = "white";
                document.body.innerText = "Erro Ao Renderizar Bebê Com Capa.";
                console.error(err);
            }
        }
        window.onload = renderizarAutomatico;
    </script>
</body>
</html>
