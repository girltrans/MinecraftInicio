    <style>
        * {
            box-sizing: border-box;
            font-family: 'Righteous', cursive !important;
        }
        html, body {
            width: 100%;
            overflow-x: hidden;
            overscroll-behavior-x: contain;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('images/background.png') no-repeat center center fixed;
            background-size: cover;
            color: #e8b901;
            min-height: 100vh;
        }
        body.theme-light-bg {
            background-image: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)), url('images/background2.png');
        }
        body.theme-light-bg .github img {
            filter: invert(0);
            opacity: 0.6;
        }
        @keyframes rainbow-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body.theme-rainbow-bg {
            background-image: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #FF0000, #FFA500, #FFFF00, #00FF00, #0000FF, #4B0082, #EE82EE, #23d5ab), url('images/background3.png');
            background-size: 400% 400%, cover;
            animation: rainbow-animation 15s ease infinite;
        }
        .content { max-width: 1200px; margin: 0 auto; padding-top: 2rem; }
        .github { position: absolute; right: 20px; top: 80px; }
        * { scrollbar-color: #8B1616 #121212; scrollbar-width: thin; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background-color: #8B1616; border-radius: 6px; border: 2px solid #121212; }
        ::-webkit-scrollbar-thumb:hover { background-color: #e8b901; }
        .studio-container {
            background: rgba(18, 18, 18, 0.9);
            border-radius: 22px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 2px 18px #8b1616;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 450px;
            text-align: center;
            margin: 2rem auto; /* Centraliza no container principal */
        }
        .studio-container h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #e8b901;
        }
        .search-box {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            justify-content: center;
            margin-bottom: 15px;
            margin-top: 15px;
        }
        .search-box input[type="text"] {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid #8B1616;
            font-size: 1rem;
            background: #121212;
            color: #e8b901;
            outline: none;
            box-shadow: 0 2px 10px rgba(139, 22, 22, 0.5);
        }
        .search-box input[type="text"]::placeholder {
            color: #e8b901;
            opacity: 0.7;
        }
        .studio-container button {
            background: #121212;
            color: #E8B901;
            border: 1px solid #8B1616;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 2px 18px #8b1616;
        }
        .studio-container button:hover {
            background-color: #E8B901;
            color: #121212;
            transform: scale(1.05);
        }
        #ign_status {
            font-size: 0.98rem;
            color: #ffd700;
            height: 1.8em;
            margin-bottom: 10px;
            text-shadow: 0 1px 4px #0005;
        }
        .render-viewer {
            background: #121212;
            border-radius: 18px;
            box-shadow: 0 2px 18px #8b1616;
            width: 300px;
            height: 300px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #8B1616;
            position: relative;
            overflow: hidden;
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        canvas {
            display: block;
            outline: none;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }
        .button-group button {
            flex: 1;
            width: auto;
            margin-top: 0 !important;
            font-size: 0.9rem !important;
            padding: 0.6rem 0.5rem !important;
        }
		body.allow-scroll {
            overflow-y: auto !important;
            height: auto !important;
        }
        html.allow-scroll {
            overflow-y: auto !important;
        }
    </style>

    <script src="idioma/translationsindex.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeSwitcher = document.getElementById('theme_switcher');
            function applyTheme(theme) {
                document.body.classList.remove('theme-light-bg', 'theme-rainbow-bg');
                if (theme === 'light') {
                    document.body.classList.add('theme-light-bg');
                } else if (theme === 'rainbow') {
                    document.body.classList.add('theme-rainbow-bg');
                }
                localStorage.setItem('site_theme', theme);
            }
            themeSwitcher.addEventListener('change', function() {
                applyTheme(this.value);
            });
            const savedTheme = localStorage.getItem('site_theme') || 'dark';
            themeSwitcher.value = savedTheme;
            applyTheme(savedTheme);
        });
        document.addEventListener("DOMContentLoaded", () => {
            const langSelector = `
                <select id="idiomaSelect" onchange="onLanguageChange(this.value)"
                style="padding:5px;border-radius:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right: 20px;position:relative;top:8px;background:#121212;color:#e8b901;border:1px solid #8B1616;box-shadow: 0 2px 18px #8b1616;cursor:pointer;">
                    <option value="pt-BR">Português 🇧🇷</option>
                    <option value="pt-PT">Português 🇵🇹</option>
                    <option value="es">Español 🇪🇸</option>
                    <option value="us">English 🇺🇸</option>
                    <option value="fr">Français 🇫🇷</option>
                    <option value="jp">日本語 🇯🇵</option>
                    <option value="kr">한국어 🇰🇷</option>
                    <option value="zh-CN">中文-简体 🇨🇳</option>
                    <option value="zh-TW">中文-繁體 🇨🇳</option>
                    <option value="ru">Русский 🇷🇺</option>
                    <option value="de">Deutsch 🇩🇪</option>
                </select>
            `;
            const themeElement = document.querySelector("#theme_switcher"); 
            if (themeElement) {
                themeElement.insertAdjacentHTML("beforebegin", langSelector);
            }
            
            const savedLang = localStorage.getItem("siteLang") || "pt-BR";
            const selectEl = document.getElementById("idiomaSelect");
            if(selectEl) selectEl.value = savedLang;
        });

        function onLanguageChange(lang) {
            localStorage.setItem("siteLang", lang);
        }
    </script>
    <script>
        let skinViewer;
        async function getPlayerTextures(playerName) {
            const uuidResponse = await fetch(`https://corsjangapi.b-cdn.net/users/profiles/minecraft/${playerName}`, { cache: 'reload' });
            if (!uuidResponse.ok) throw new Error('Jogador não encontrado!');
            const playerData = await uuidResponse.json();
            const uuid = playerData.id;
            const profileResponse = await fetch(`https://api.gapple.pw/cors/sessionserver/${uuid}`, { cache: 'reload' });
            if (!profileResponse.ok) throw new Error('Não foi possível obter o perfil');
            const profileData = await profileResponse.json();
            const texturesProperty = profileData.properties.find(prop => prop.name === 'textures');
            if (!texturesProperty) throw new Error('Propriedades de textura não encontradas');
            const decodedValue = atob(texturesProperty.value);
            const textureData = JSON.parse(decodedValue);
            let skinUrl = textureData.textures?.SKIN?.url;
            if (!skinUrl) throw new Error('URL da skin não encontrada');
            skinUrl = skinUrl.replace("http://", "https://");
            let capeUrl = null;
            if (textureData.textures?.CAPE?.url) {
                capeUrl = textureData.textures.CAPE.url.replace("http://", "https://");
            }
            return { skinUrl, capeUrl };
        }
        async function renderBabySkin(textures) {
            const container = document.getElementById("canvas-container");
            container.innerHTML = ""; 
            const canvasElement = document.createElement("canvas");
            canvasElement.style.opacity = "0"; 
            canvasElement.style.transition = "opacity 0.3s ease-in-out"; 
            skinViewer = new skinview3d.SkinViewer({
                canvas: canvasElement,
                width: 300,
                height: 300,
                alpha: true 
            });
            container.appendChild(skinViewer.canvas);
            const promessasCarregamento = [];
            if (textures.skinUrl) promessasCarregamento.push(skinViewer.loadSkin(textures.skinUrl));
            if (textures.capeUrl) promessasCarregamento.push(skinViewer.loadCape(textures.capeUrl));
            await Promise.all(promessasCarregamento);
            skinViewer.zoom = 0.96;
            const player = skinViewer.playerObject;
            player.scale.set(0.9, 0.65, 0.9);
            player.skin.head.scale.set(1.83, 2.54, 1.83);
            player.skin.rightLeg.rotation.x = -0.15;
            player.skin.leftLeg.rotation.x = 0.15;
            player.skin.rightArm.rotation.x = 0.15;
            player.skin.leftArm.rotation.x = -0.15;
            player.position.y = -6.0; 
            player.rotation.y = Math.PI / 8;
            skinViewer.animation = null;
            skinViewer.render();
            requestAnimationFrame(() => {
                canvasElement.style.opacity = "1";
            });
            const renderPerfeitoBase64 = skinViewer.canvas.toDataURL("image/png");
            skinViewer.controls.enableRotate = true;
            skinViewer.controls.enableZoom = true;
            skinViewer.controls.enablePan = true;
            document.getElementById("actionButtons").style.display = 'flex';
            function abrirEmNovaGuia() {
                const nick = document.getElementById('ign').value || 'Bebê';
                const novaAba = window.open();
                if (novaAba) {
                    novaAba.document.write(`
                        <!DOCTYPE html>
                        <html lang="pt-BR">
                        <head>
                            <meta charset="UTF-8">
                            <meta name="viewport" content="width=device-width, minimum-scale=0.1">
                            <title>${nick}.png</title>
                        </head>
                        <body style="margin: 0px; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: transparent;">
                            <img style="display: block; margin: auto;" src="${renderPerfeitoBase64}" alt="Avatar PNG">
                        </body>
                        </html>
                    `);
                    novaAba.document.close();
                } else {
                    alert("O navegador bloqueou a nova aba. Por favor, permita pop-ups.");
                }
            }
            document.getElementById('openTabBtn').onclick = abrirEmNovaGuia;
            skinViewer.canvas.oncontextmenu = function(e) {
                e.preventDefault(); 
                abrirEmNovaGuia();
            };
            document.getElementById('downloadBtn').onclick = () => {
                const link = document.createElement('a');
                link.href = renderPerfeitoBase64;
                link.download = `${document.getElementById('ign').value || 'avatar'}-avatar.png`;
                link.click();
            };
        }
        document.getElementById('render-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const ign = document.getElementById('ign').value.trim();
            const statusDiv = document.getElementById('ign_status');
            const btn = document.getElementById('gerarBtn');
            if (!ign) return;
            btn.disabled = true;
            btn.textContent = "Buscando...";
            statusDiv.textContent = "Buscando Skin e Capa...";
            document.getElementById("actionButtons").style.display = 'none';
            try {
                const textures = await getPlayerTextures(ign);
                statusDiv.textContent = "Renderizando Bebê Com Capa...";
                await renderBabySkin(textures);
                statusDiv.textContent = "Bebê Gerado Com Sucesso!";
                setTimeout(() => statusDiv.textContent = "", 4000);
            } catch (error) {
                statusDiv.textContent = error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = "Gerar";
            }
        });
        document.getElementById('ign').addEventListener('input', function() {
            this.value = this.value.replace(/[^a-zA-Z0-9_]/g, '');
        });
        window.addEventListener('DOMContentLoaded', async () => {
            const statusDiv = document.getElementById('ign_status');
            try {
                const texturasPadrao = {
                    skinUrl: "https://minotar.net/skin/ata",
                    capeUrl: null
                };
                await renderBabySkin(texturasPadrao);
                document.getElementById("actionButtons").style.display = 'none';
                statusDiv.textContent = "Coloque Seu Nick...";
            } catch (error) {
                console.error("Erro ao carregar pré-renderização:", error);
            }
        });
    </script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    let sequenciaDigitada = '';
    const palavrasSecretas = ['traum', 'wtraum', 'trauma', 'wtrauma', 'traumwest', 'wtraumwest'];
    const tamanhoMaximo = Math.max(...palavrasSecretas.map(p => p.length));
    const urlDaImagem = './icons/traum.png';
    let timerOpacidade;
    let timerRemocao;
    let timerQuebra;
    const estiloEfeitos = document.createElement('style');
    estiloEfeitos.innerHTML = `
        #traum-easter-egg {
            cursor: url('./mouse/pointer.png'), auto !important;
        }
        .easter-egg-physics {
            cursor: url('./mouse/link.png'), pointer !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .easter-egg-physics img {
            -webkit-user-drag: none;
            pointer-events: none;
        }
        @keyframes subirInterno {
            0% { top: 100%; opacity: 0; transform: scale(0.8); }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: -20%; opacity: 0; transform: scale(1.2); }
        }
        @keyframes corArcoIrisInterno {
            0% { color: #ff0000; text-shadow: 0 0 5px #ff0000; }
            20% { color: #ffff00; text-shadow: 0 0 5px #ffff00; }
            40% { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
            60% { color: #00ffff; text-shadow: 0 0 5px #00ffff; }
            80% { color: #0000ff; text-shadow: 0 0 5px #0000ff; }
            100% { color: #ff00ff; text-shadow: 0 0 5px #ff00ff; }
        }
        .efeito-interno-aura {
            position: absolute;
            font-size: 1.8rem;
            font-weight: 900;
            font-family: 'Righteous', cursive;
            pointer-events: none;
            animation: subirInterno 2.5s linear forwards, corArcoIrisInterno 1.5s linear infinite;
            z-index: 10;
        }
        @keyframes bubbly-physics-img {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 8px 32px rgba(139, 22, 22, 1);
                border-color: rgba(139, 22, 22, 1);
            }
            50% {
                transform: translateY(-15px) scale(1.02);
                box-shadow: 0 15px 45px rgba(139, 22, 22, 1) 
                border-color: #E8B901;
            }
        }
        .easter-egg-physics:hover {
            animation: bubbly-physics-img 2s ease-in-out infinite;
        }
    `;
    document.head.appendChild(estiloEfeitos);
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            cancelarTudo();
            return;
        }
        if (event.key.length === 1) {
            sequenciaDigitada += event.key.toLowerCase();
        }
        if (sequenciaDigitada.length > tamanhoMaximo) {
            sequenciaDigitada = sequenciaDigitada.slice(-tamanhoMaximo);
        }
        const palavraEncontrada = palavrasSecretas.find(palavra => sequenciaDigitada.endsWith(palavra));
        if (palavraEncontrada) {
            cancelarTudo(); 
            mostrarImagemSecreta();
            sequenciaDigitada = '';
        }
    });
    function cancelarTudo() {
        let overlayExistente = document.getElementById('traum-easter-egg');
        if (overlayExistente) overlayExistente.remove();
        clearTimeout(timerOpacidade);
        clearTimeout(timerRemocao);
        clearTimeout(timerQuebra);
        if(window.intervaloEfeitosInternos) clearInterval(window.intervaloEfeitosInternos);
    }
    function mostrarImagemSecreta() {
        const overlay = document.createElement('div');
        overlay.id = 'traum-easter-egg';
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100vw';
        overlay.style.height = '100vh';
        overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.8)';
        overlay.style.display = 'flex';
        overlay.style.justifyContent = 'center';
        overlay.style.alignItems = 'center';
        overlay.style.zIndex = '999999';
        overlay.style.opacity = '0';
        overlay.style.transition = 'opacity 0.5s ease';
        const imgContainer = document.createElement('div');
        imgContainer.className = 'easter-egg-physics'; 
        imgContainer.style.position = 'relative';
        imgContainer.style.maxWidth = '80vw'; 
        imgContainer.style.maxHeight = '80vh';
        imgContainer.style.borderRadius = '16px';
        imgContainer.style.boxShadow = '0 8px 32px rgba(139, 22, 22, 1)';
        imgContainer.style.border = '1px solid #8B1616';
        imgContainer.style.overflow = 'hidden'; 
        imgContainer.style.display = 'flex';
        imgContainer.style.backgroundColor = '#121212'; 
        imgContainer.addEventListener('contextmenu', e => e.preventDefault());
        const img = document.createElement('img');
        img.src = urlDaImagem;
        img.style.maxWidth = '100%';
        img.style.maxHeight = '100%';
        img.style.objectFit = 'contain';
        img.draggable = false;
        imgContainer.appendChild(img);
        overlay.appendChild(imgContainer);
        document.body.appendChild(overlay);
        setTimeout(() => {
            if(document.getElementById('traum-easter-egg')) overlay.style.opacity = '1';
        }, 50);
        iniciarEfeitosInternos(imgContainer);
        timerQuebra = setTimeout(() => {
            if (document.body.contains(img)) {
                if(window.intervaloEfeitosInternos) clearInterval(window.intervaloEfeitosInternos);
                imgContainer.className = ''; 
                imgContainer.style.border = 'none';
                imgContainer.style.boxShadow = 'none';
                imgContainer.style.backgroundColor = 'transparent';
                imgContainer.querySelectorAll('.efeito-interno-aura').forEach(el => el.style.visibility = 'hidden');
                quebrarImagem(img, overlay);
            }
        }, 11000); 
        timerOpacidade = setTimeout(() => {
            if(document.getElementById('traum-easter-egg')) {
                overlay.style.opacity = '0';
                timerRemocao = setTimeout(() => {
                    if (overlay.parentNode) {
                        overlay.parentNode.removeChild(overlay);
                    }
                }, 500);
            }
        }, 11600);
    }
    function iniciarEfeitosInternos(container) {
        if(window.intervaloEfeitosInternos) clearInterval(window.intervaloEfeitosInternos);
        window.intervaloEfeitosInternos = setInterval(() => {
            if (container.querySelectorAll('.efeito-interno-aura').length >= 3) {
                return; 
            }
            const aura = document.createElement('div');
            aura.className = 'efeito-interno-aura';
            aura.textContent = 'W Traum';
            aura.style.left = (Math.random() * 70) + '%'; 
            const duracao = 2 + Math.random(); 
            aura.style.animationDuration = duracao + 's, 1.5s'; 
            container.appendChild(aura);
            setTimeout(() => { 
                if(aura.parentNode) aura.remove(); 
            }, duracao * 1000);
            
        }, 400); 
    }
    function quebrarImagem(img, wrapperOverlay) {
        const rect = img.getBoundingClientRect();
        img.style.visibility = 'hidden'; 
        const cols = 6;
        const rows = 6;
        const pieceWidth = rect.width / cols;
        const pieceHeight = rect.height / rows;
        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                const piece = document.createElement('div');
                piece.style.position = 'absolute';
                piece.style.width = pieceWidth + 'px';
                piece.style.height = pieceHeight + 'px';
                piece.style.left = (rect.left + (i * pieceWidth)) + 'px'; 
                piece.style.top = (rect.top + (j * pieceHeight)) + 'px';
                piece.style.backgroundImage = `url(${img.src})`;
                piece.style.backgroundSize = `${rect.width}px ${rect.height}px`;
                piece.style.backgroundPosition = `-${i * pieceWidth}px -${j * pieceHeight}px`;
                piece.style.transition = 'all 0.6s cubic-bezier(0.25, 1, 0.5, 1)'; 
                wrapperOverlay.appendChild(piece);
                const centroX = cols / 2;
                const dirX = (i - centroX) / centroX; 
                const randomX = dirX * (Math.random() * 200 + 50); 
                const randomY = Math.random() * 200 + 100; 
                const randomRot = (Math.random() - 0.5) * 500; 
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        piece.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${randomRot}deg) scale(0)`;
                        piece.style.opacity = '0';
                    });
                });
            }
        }
    }
});
</script>
<script>
function changeLanguage(lang) {
  localStorage.setItem("siteLang", lang);
  const elements = document.querySelectorAll("[data-i18n]");
  elements.forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (translations[lang] && translations[lang][key]) {
      if (el.hasAttribute("placeholder")) {
        el.placeholder = translations[lang][key];
        el.setAttribute("title", translations[lang][key]);
      } else {
        el.textContent = translations[lang][key];
      }
    }
  });
  if (translations[lang]["pageTitle"]) {
    document.title = translations[lang]["pageTitle"];
  }
  if (translations[lang]["pageDescription"]) {
    const metaDesc = document.querySelector('meta[property="og:description"]');
    if (metaDesc) {
      metaDesc.setAttribute("content", translations[lang]["pageDescription"]);
    }
  }
  applyDynamicTranslations(lang);
  document.addEventListener("DOMContentLoaded", () => {
  let savedLang = localStorage.getItem("siteLang");
  if (!savedLang) {
    const browserLang = navigator.language || navigator.userLanguage;
    if (translations[browserLang]) {
      savedLang = browserLang;
    } else {
      savedLang = "pt-BR";
    }
    localStorage.setItem("siteLang", savedLang);
  }
  document.querySelector("#idiomaSelect").value = savedLang;
  changeLanguage(savedLang);
});
  const currentType = document.querySelector('input[name="optifine_cape_type"]:checked');
  if (currentType) {
    renderOptions(currentType.value);
  }
}
  document.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("siteLang") || "pt-BR";
  document.querySelector("#idiomaSelect").value = savedLang;
  changeLanguage(savedLang);
});
  function updateTitleLanguage(lang) {
  const elementsWithTitle = document.querySelectorAll("[data-i18n-title]");
  elementsWithTitle.forEach(el => {
    const key1 = el.getAttribute("data-i18n-title");
    const key2 = el.getAttribute("data-i18n-title2"); 
    const key3 = el.getAttribute("data-i18n-title3"); 
    let fullTitle = "";
    const keysToCombine = [key1, key2, key3].filter(key => key !== null);
    keysToCombine.forEach(key => {
      if (translations[lang] && translations[lang][key]) {
        if (fullTitle.length > 0) {
          fullTitle += "\n"; 
        }
        fullTitle += translations[lang][key];
      }
    });
    if (fullTitle.length > 0) {
      el.setAttribute("title", fullTitle);
    }
    else {
        el.removeAttribute("title");
    }
  });
}
  function onLanguageChange(lang) {
    changeLanguage(lang); 
    updateTitleLanguage(lang);
  }
  document.addEventListener("DOMContentLoaded", () => {
    const savedLang = localStorage.getItem("siteLang") || "pt-BR";
    updateTitleLanguage(savedLang);
  });
</script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    let sequenciaEfeitos = '';
    const palavrasSecretas = ['traum', 'wtraum', 'trauma', 'wtrauma', 'traumwest', 'wtraumwest'];
	const tamanhoMaximo = Math.max(...palavrasSecretas.map(p => p.length));
    const estiloAnimacoes = document.createElement('style');
    estiloAnimacoes.innerHTML = `
        @keyframes cairFoguinho {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(20deg); opacity: 0; }
        }
        @keyframes subirAura {
            0% { transform: translateY(10vh) scale(0.8); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
        }
        @keyframes corArcoIris {
            0% { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
            20% { color: #ffff00; text-shadow: 0 0 10px #ffff00; }
            40% { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
            60% { color: #00ffff; text-shadow: 0 0 10px #00ffff; }
            80% { color: #0000ff; text-shadow: 0 0 10px #0000ff; }
            100% { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
        }
        .traum-foguinho {
            position: fixed;
            font-size: 2.5rem;
            z-index: 999998;
            pointer-events: none;
            animation: cairFoguinho linear forwards;
        }
        .traum-aura {
            position: fixed;
            font-size: 2rem;
            font-weight: 900;
            font-family: 'Righteous', cursive;
            z-index: 999998;
            pointer-events: none;
            animation: subirAura linear forwards, corArcoIris 1.5s linear infinite;
        }
    `;
    document.head.appendChild(estiloAnimacoes);
    document.addEventListener('keydown', function(event) {
        if (event.key.length === 1) {
            sequenciaEfeitos += event.key.toLowerCase();
        }
		if (sequenciaEfeitos.length > tamanhoMaximo) {
            sequenciaEfeitos = sequenciaEfeitos.slice(-tamanhoMaximo);
        }
        const palavraEncontrada = palavrasSecretas.find(palavra => sequenciaEfeitos.endsWith(palavra));
        if (palavraEncontrada) {
            iniciarEfeitos();
            sequenciaEfeitos = '';
        }
    });
    function iniciarEfeitos() {
        if (window.efeitosTraumAtivos) return;
        window.efeitosTraumAtivos = true;
        const duracaoTotal = 12250;
        const tempoFinal = Date.now() + duracaoTotal;
        window.geradorDeEfeitos = setInterval(() => {
            if (Date.now() > tempoFinal) {
                clearInterval(geradorDeEfeitos);
                window.efeitosTraumAtivos = false;
                return;
            }
            criarFoguinho();
            criarAura();
        }, 200);
    }
    function criarFoguinho() {
        const foguinho = document.createElement('div');
        foguinho.className = 'traum-foguinho';
        foguinho.textContent = '🔥';
        foguinho.style.left = Math.random() * 100 + 'vw';
        foguinho.style.top = '-50px';
        const duracaoQueda = 1.5 + Math.random() * 2;
        foguinho.style.animationDuration = duracaoQueda + 's';
        document.body.appendChild(foguinho);
        setTimeout(() => foguinho.remove(), duracaoQueda * 1000);
    }
    function criarAura() {
        const aura = document.createElement('div');
        aura.className = 'traum-aura';
        aura.textContent = 'W Traum';
        aura.style.left = Math.random() * 100 + 'vw';
        aura.style.bottom = '-50px';
        const duracaoSubida = 2 + Math.random() * 3;
        aura.style.animationDuration = duracaoSubida + 's, 1.5s';
        document.body.appendChild(aura);
        setTimeout(() => aura.remove(), duracaoSubida * 1000);
    }
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    let sequenciaAudio = '';
    const palavrasAudio = ['traum', 'wtraum', 'trauma', 'wtrauma', 'traumwest', 'wtraumwest'];
    const tamanhoMaxAudio = Math.max(...palavrasAudio.map(p => p.length));
    const meuAudioSecreto = new Audio('./audio/aura.mp3'); 
    meuAudioSecreto.volume = 0.8; 
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            meuAudioSecreto.pause();
            meuAudioSecreto.currentTime = 0;
            sequenciaAudio = '';
            return;
        }
        if (event.key.length === 1) {
            sequenciaAudio += event.key.toLowerCase();
        }
        if (sequenciaAudio.length > tamanhoMaxAudio) {
            sequenciaAudio = sequenciaAudio.slice(-tamanhoMaxAudio);
        }
        const palavraEncontrada = palavrasAudio.find(palavra => sequenciaAudio.endsWith(palavra));
        if (palavraEncontrada) {
            meuAudioSecreto.currentTime = 0; 
            meuAudioSecreto.play();
            sequenciaAudio = '';
        }
    });
});
</script>
